<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İş Akışları | PDFsHub</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="canonical" href="https://pdfshub.com/workflows.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css?v=4">
    <link rel="stylesheet" href="account.css?v=1">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="navbar">
        <a class="logo" href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit;">
            <img src="logo.png" alt="PDFsHub Logo" style="height: 32px; width: auto; object-fit: contain;"> PDFsHub
        </a>
        <div class="nav-right" style="display: flex; align-items: center; gap: 1rem;">
        </div>
    </nav>

    <main id="main-content" class="wf-main">
        <div class="hero">
            <h1 id="wf-title">İş Akışları</h1>
            <p id="wf-desc"></p>
        </div>

        <section id="wf-login" class="wf-card wf-login" hidden>
            <i class="fa-solid fa-diagram-project wf-login-icon"></i>
            <h2 id="wf-login-title"></h2>
            <p id="wf-login-desc"></p>
            <div class="wf-login-actions">
                <button type="button" id="wf-login-btn" class="acc-btn acc-btn-ghost"></button>
                <button type="button" id="wf-register-btn" class="acc-btn acc-btn-primary"></button>
            </div>
        </section>

        <div id="wf-app" class="wf-grid" hidden>
            <section id="wf-builder" class="wf-card">
                <h2 id="wf-builder-title"></h2>
                <label class="wf-opt">
                    <span id="wf-name-label"></span>
                    <input type="text" id="wf-name" maxlength="100">
                </label>
                <h3 id="wf-steps-title"></h3>
                <select id="wf-add-step" class="wf-add"></select>
                <div id="wf-steps" class="wf-steps"></div>
                <p id="wf-message" class="wf-message" role="status"></p>
                <div class="wf-row">
                    <button type="button" id="wf-save" class="acc-btn acc-btn-primary"></button>
                    <button type="button" id="wf-save-new" class="acc-btn acc-btn-ghost"></button>
                    <button type="button" id="wf-reset" class="acc-btn acc-btn-ghost"></button>
                </div>
            </section>

            <div class="wf-side">
                <section class="wf-card">
                    <h2 id="wf-run-title"></h2>
                    <label id="wf-drop" class="wf-drop">
                        <i class="fa-solid fa-file-pdf"></i>
                        <span id="wf-drop-text"></span>
                        <input type="file" id="wf-files" accept="application/pdf,.pdf" multiple hidden>
                    </label>
                    <p id="wf-file-list" class="wf-files"></p>
                    <div id="wf-pass-box" class="wf-pass"></div>
                    <button type="button" id="wf-run-btn" class="acc-btn acc-btn-primary acc-btn-block"></button>
                    <p id="wf-run-status" class="wf-message" role="status"></p>
                    <a id="wf-download" class="acc-btn acc-btn-primary acc-btn-block wf-download" hidden></a>
                </section>

                <section class="wf-card">
                    <h2 id="wf-saved-title"></h2>
                    <div id="wf-saved"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="account.js?v=1"></script>
    <script src="workflows.js?v=1"></script>
</body>

</html>
